<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src wcc-media:; media-src wcc-media:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>:root{color-scheme:light dark}body{font:14px -apple-system;margin:16px}h2{font-size:21px;margin:0 0 8px}p,small{color:#888;font-size:12px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}a{color:inherit;text-decoration:none;border:1px solid #8883;border-radius:16px;padding:10px 4px;text-align:center;overflow-wrap:anywhere;background:#8881}figure{height:64px;margin:0 0 8px;display:grid;place-items:center}img,video{width:64px;height:64px;object-fit:contain}small{display:block}</style><h2>让天气，多一点个性</h2><p>仅可见卡片按需加载，最多两项动态预览。轻触应用并在上方原生预览；网页不可用时仍可用“原生列表”。</p><main id="grid"></main><p id="status">正在读取素材目录…</p><script>
const grid=document.querySelector('#grid'), status=document.querySelector('#status');
let cards=[], running=new Map(), paused=false;
function release(card){const media=running.get(card);if(!media)return;if(media.tagName==='VIDEO'){media.pause();media.removeAttribute('src');media.load()}else media.removeAttribute('src');media.remove();running.delete(card);card.querySelector('figure').textContent='▷';}
function schedule(){
 const wanted=paused?[]:cards.filter(c=>{let r=c.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight&&!c.dataset.failed}).slice(0,2);
 for(const c of [...running.keys()])if(!wanted.includes(c))release(c);
 for(const c of wanted){if(running.has(c))continue;let media=document.createElement(c.dataset.video==='1'?'video':'img');media.muted=true;media.loop=true;media.autoplay=true;media.playsInline=true;media.preload='none';media.onerror=()=>{c.dataset.failed='1';release(c);c.querySelector('figure').textContent='原生预览';schedule()};c.querySelector('figure').textContent='';c.querySelector('figure').append(media);running.set(c,media);media.src='wcc-media://media/'+c.dataset.id;if(media.tagName==='VIDEO')media.play().catch(()=>{});}
}
window.populate=function(items,message){for(const c of [...running.keys()])release(c);cards=[];grid.textContent='';status.textContent=message;for(const item of items){let c=document.createElement('a');c.href='wcc-select://item/'+item.id;c.dataset.id=item.id;c.dataset.video=item.video?'1':'0';let f=document.createElement('figure');f.textContent='▷';let n=document.createElement('small');n.textContent=item.name;c.append(f,n);grid.append(c);cards.push(c)}requestAnimationFrame(schedule)};
window.pauseGallery=function(){paused=true;schedule()};window.resumeGallery=function(){paused=false;schedule()};
let tick=false;addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;schedule()})},{passive:true});addEventListener('resize',schedule);document.addEventListener('visibilitychange',()=>{paused=document.hidden;schedule()});
</script>
