name: CCWeatherModule 1.2.11 rootless
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: brew install ldid dpkg
      - name: Setup Theos and private SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Build and inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          sh evidence/test130_sileo_postinst.sh layout/DEBIAN/postinst | tee verification/sileo130-source.txt
          python3 evidence/test130.py | tee verification/static130.txt
          sh evidence/run1211-foundation.sh 2>&1 | tee verification/foundation1211.txt
          python3 evidence/test1211.py | tee verification/static1211.txt
          cc -std=gnu11 -Wall -Wextra -Werror evidence/runtime129.c -lm -o /tmp/runtime129
          /tmp/runtime129 | tee verification/runtime129.txt
          python3 evidence/test129.py | tee verification/static129.txt
          cc -std=gnu11 -Wall -Wextra -Werror evidence/runtime128.c -lm -o /tmp/runtime128
          /tmp/runtime128 | tee verification/runtime128.txt
          sh evidence/run128-foundation.sh 2>&1 | tee verification/foundation128.txt
          python3 evidence/test128.py | tee verification/static128.txt
          cc -std=gnu11 -Wall -Wextra -Werror evidence/runtime127.c -lm -o /tmp/runtime127
          /tmp/runtime127 | tee verification/runtime127.txt
          sh evidence/run127-foundation.sh 2>&1 | tee verification/foundation127.txt
          python3 evidence/test127.py | tee verification/static127.txt
          sh evidence/run126-foundation.sh 2>&1 | tee verification/foundation126.txt
          python3 evidence/test126.py | tee verification/static126.txt
          python3 evidence/test122_safety.py | tee verification/safety122-static.txt
          sh evidence/run125-foundation.sh 2>&1 | tee verification/foundation125.txt
          python3 evidence/test125.py | tee verification/static125.txt
          sh evidence/run124-foundation.sh 2>&1 | tee verification/foundation124.txt
          python3 evidence/test124.py | tee verification/static124.txt
          sh evidence/run121-foundation.sh 2>&1 | tee verification/foundation121.txt
          sh evidence/run120-source.sh 2>&1 | tee verification/source120.txt
          python3 evidence/test121_settings.py | tee verification/settings121.txt
          python3 evidence/test120_source.py | tee verification/source120-static.txt
          for test in layout boundary; do
            cc -std=gnu11 -Wall -Wextra evidence/runtime120-$test.c -lm -o /tmp/runtime120-$test
            /tmp/runtime120-$test | tee verification/runtime120-$test.txt
          done
          cc -Wall -Wextra -Werror evidence/runtime121.c -lm -o /tmp/runtime121
          /tmp/runtime121 | tee verification/runtime121.txt
          python3 evidence/test123.py | tee verification/static123.txt
          cc -std=gnu11 -Wall -Wextra -Werror evidence/redo122.c -lm -o /tmp/redo123
          /tmp/redo123 | tee verification/geometry123.txt
          clang -fobjc-arc -fblocks -DWCC_TESTING=1 -framework Foundation -framework CoreFoundation src/WCCPreferences.m src/WCCConfigurations.m evidence/configurations123.m -o /tmp/configurations123
          /tmp/configurations123 | tee verification/configurations123.txt
          make package FINALPACKAGE=1 2>&1 | tee build.log
          mkdir -p verification
          cc -Wall -Wextra -Werror evidence/runtime115.c -lm -o /tmp/runtime115
          /tmp/runtime115 | tee verification/runtime115.txt
          python3 evidence/test118.py --generate | tee verification/wiring117.txt
          python3 evidence/regression118.py | tee verification/regression118.txt
          clang -fobjc-arc -fblocks -framework Foundation -framework CoreGraphics evidence/hourly118-generated.m -o /tmp/hourly118
          /tmp/hourly118 | tee verification/hourly118.txt
          cc -Wall -Wextra -Werror evidence/layout118.c -lm -o /tmp/layout118
          /tmp/layout118 | tee verification/layout118.txt
          python3 evidence/test122_ui.py | tee verification/ui118.txt
          git diff --exit-code -- evidence/hourly118-generated.m
          cc -Wall -Wextra -Werror evidence/hourly116.c -o /tmp/hourly116
          /tmp/hourly116 | tee verification/hourly116.txt
          clang -fobjc-arc -fblocks -I evidence/mock115 -framework Foundation evidence/host118.m -o /tmp/host118 2>&1 | tee verification/host118-build.txt
          for mode in modern legacy inherited getter-char reject-bool reject-return reject-argc reject-missing; do
            /tmp/host118 "$mode" 2>&1 | tee "verification/host118-${mode}.txt"
          done
          cc evidence/mapping114.c -o /tmp/mapping114
          /tmp/mapping114 | tee verification/mapping114.txt
          clang -fobjc-arc -framework Foundation evidence/mapping114.m src/WCCPreferences.m -o /tmp/mapping114objc
          /tmp/mapping114objc | tee verification/mapping114-objc.txt
          python3 evidence/test114_mapping.py | tee verification/mapping114-wiring.txt
          DEB=$(find packages -name '*.deb' | head -1)
          dpkg-deb -I "$DEB" | tee verification/control.txt
          dpkg-deb -c "$DEB" | tee verification/contents.txt
          dpkg-deb -e "$DEB" /tmp/wcc-control
          SCRIPTS=''
          for f in /tmp/wcc-control/*; do test "$(basename "$f")" = control || SCRIPTS="$SCRIPTS $(basename "$f")"; done
          test "${SCRIPTS# }" = postinst
          DEB="$DEB" python3 - <<'PY'
          import io,os,subprocess,tarfile
          raw=subprocess.check_output(['dpkg-deb','--ctrl-tarfile',os.environ['DEB']])
          members={m.name.lstrip('./'):m for m in tarfile.open(fileobj=io.BytesIO(raw)).getmembers()}
          assert set(k for k,v in members.items() if v.isfile()) == {'control','postinst'}
          m=members['postinst']; assert m.mode==0o755 and m.uname=='root' and m.gname=='wheel'
          PY
          cmp layout/DEBIAN/postinst /tmp/wcc-control/postinst
          sh -n /tmp/wcc-control/postinst
          sh evidence/test130_sileo_postinst.sh /tmp/wcc-control/postinst | tee verification/sileo130-packaged.txt
          grep -qx ' Version: 1.2.11' verification/control.txt
          dpkg-deb -x "$DEB" /tmp/wcc-payload
          BUNDLE=/tmp/wcc-payload/var/jb/Library/ControlCenter/Bundles/CCWeatherModule.bundle
          BIN="$BUNDLE/CCWeatherModule"
          test -f "$BUNDLE/SettingsIcon@3x.png"
          cmp Resources/SettingsIcon@3x.png "$BUNDLE/SettingsIcon@3x.png"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$BUNDLE/Info.plist" | grep -qx '1.2.11'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$BUNDLE/Info.plist" | grep -qx '1.2.11'
          lipo -info "$BIN" | tee verification/architectures.txt
          grep -q 'arm64 arm64e' verification/architectures.txt
          otool -L "$BIN" | tee verification/linkage.txt
          ldid -e "$BIN" > verification/entitlements.xml
          shasum -a 256 "$DEB" | tee verification/SHA256SUMS
          xcrun simctl list runtimes > verification/simulator-runtimes.txt
          echo '1.2.11 weather-details toggle Foundation/static tests and 1.2.10 Sileo dynamic-fd protocol: RUN. 1.2.9 through 1.2.4 historical regressions: RUN. True UIKit rendering, live network providers, Sileo completion button and iPhone 14 Pro Max iOS 16.6 RootHide: NOT RUN.' > verification/runtime-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CCWeatherModule-1.2.11-rootless
          path: |
            packages/*.deb
            verification/*
            build.log
          if-no-files-found: error
